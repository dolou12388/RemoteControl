name: Build Windows Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build desktop client
        working-directory: desktop-windows
        run: .\build.bat

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlMouseDesktop
          path: desktop-windows/ControlMouseDesktop.exe

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-windows/ControlMouseDesktop.exe
